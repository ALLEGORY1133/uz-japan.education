services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uzjapan}
      POSTGRES_USER: ${POSTGRES_USER:-uzjapan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uzjapan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uzjapan} -d ${POSTGRES_DB:-uzjapan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uzjapan}:${POSTGRES_PASSWORD:-uzjapan}@db:5432/${POSTGRES_DB:-uzjapan}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_PRIVATE_ROOT: /app/private
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://127.0.0.1:3011}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://127.0.0.1:3010}
      CABINET_REQUIRE_CODE: ${CABINET_REQUIRE_CODE:-0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-UzJapan Education <noreply@uzjapan.local>}
      SEED_DEMO: ${SEED_DEMO:-1}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
    volumes:
      - media:/app/media
      - private:/app/private
      - ./backend/apps:/app/apps   # migratsiyalar host'ga yoziladi (git'ga qo'shing)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Virus skaneri: yuklangan hujjatlar shu yerda tekshiriladi. Birinchi ishga tushishda baza yuklanishi 1-3 daqiqa oladi
  # va ~1.5-2 GB xotira talab qiladi. Kerak bo'lmasa .env da CLAMAV_HOST= (bo'sh) qiling.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s

  web:
    restart: unless-stopped
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MEDIA_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://backend:8000
      WEB_CACHE_DIR: /app/.webcache
      WEB_CACHE_FRESH_SECONDS: ${WEB_CACHE_FRESH_SECONDS:-30}
      WEB_CACHE_STALE_SECONDS: ${WEB_CACHE_STALE_SECONDS:-10800}
    volumes:
      - webcache:/app/.webcache
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"

  admin:
    restart: unless-stopped
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MEDIA_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-3001}:3001"

volumes:
  pgdata:
  media:
  private:
  webcache:
  clamdb:
